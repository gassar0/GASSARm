<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حرب المدفعية</title>
    <style>
        body { margin: 0; background: #0f2027; overflow: hidden; font-family: Tahoma, sans-serif; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; color: #fff; font-weight: bold; z-index: 10; pointer-events: none; }
        .box { background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="box">النقاط: <span id="score">0</span></div>
        <div class="box">الموجة: <span id="wave">1</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0, wave = 1;
        let cannon = { x: canvas.width / 2 - 25, y: canvas.height - 90, width: 50, height: 40, lastShot: 0 };
        let bullets = [], enemies = [], lastSpawn = 0;
        let touchX = cannon.x;

        window.addEventListener('touchmove', e => { touchX = e.touches[0].clientX; });
        window.addEventListener('mousemove', e => { touchX = e.clientX; });

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // تحريك المدفع بسلاسة مع الإصبع
            cannon.x += (touchX - (cannon.x + cannon.width / 2)) * 0.2;
            if (cannon.x < 0) cannon.x = 0;
            if (cannon.x > canvas.width - cannon.width) cannon.x = canvas.width - cannon.width;

            // إطلاق النار تلقائياً
            let now = Date.now();
            if (now - cannon.lastShot > 200) {
                bullets.push({ x: cannon.x + 21, y: cannon.y, speed: 12 });
                cannon.lastShot = now;
            }

            // ظهور الأعداء
            if (now - lastSpawn > 1000) {
                enemies.push({ x: Math.random() * (canvas.width - 40), y: -40, speed: 2 });
                lastSpawn = now;
            }

            // رسم المدفع
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(cannon.x, cannon.y + 15, cannon.width, 25);
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(cannon.x + 19, cannon.y, 12, 20);

            // تحديث ورسم الطلقات
            ctx.fillStyle = '#e74c3c';
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                ctx.fillRect(bullets[i].x, bullets[i].y, 8, 16);
                if (bullets[i].y < 0) bullets.splice(i, 1);
            }

            // تحديث ورسم الأعداء
            ctx.fillStyle = '#e67e22';
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;
                ctx.fillRect(enemies[i].x, enemies[i].y, 40, 40);

                // التصادم
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j], e = enemies[i];
                    if (b.x < e.x + 40 && b.x + 8 > e.x && b.y < e.y + 40 && b.y + 16 > e.y) {
                        bullets.splice(j, 1);
                        enemies.splice(i, 1);
                        score += 10;
                        document.getElementById('score').innerText = score;
                        break;
                    }
                }
            }

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
