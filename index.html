<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>معركة الدبابات التكتيكية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #ui-header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            z-index: 10;
        }
        .stat-box {
            font-weight: bold;
            font-size: 16px;
        }
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #1e293b;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="ui-header">
    <div class="stat-box" style="color: #4ade80;">الذهب: <span id="gold-val">100</span></div>
    <div class="stat-box" style="color: #ef4444;">القاعدة: <span id="hp-val">1000</span></div>
</div>

<canvas id="canvas"></canvas>

<div id="controls">
    <button class="btn" onclick="spawnTank()">إرسال دبابة جاتلينج (50 ذهب)</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gold = 100;
let playerTanks = [];
let enemyTanks = [];
let bullets = [];

class Tank {
    constructor(x, y, isPlayer = true) {
        this.x = x;
        this.y = y;
        this.speed = isPlayer ? 1.5 : -1.2;
        this.isPlayer = isPlayer;
        this.hp = 100;
        this.maxHp = 100;
        this.lastShoot = 0;
        this.fireRate = 180;
    }

    update() {
        this.x += this.speed;

        let now = Date.now();
        if (now - this.lastShoot > this.fireRate) {
            this.shoot();
            this.lastShoot = now;
        }
    }

    shoot() {
        bullets.push({
            x: this.isPlayer ? this.x + 35 : this.x - 35,
            y: this.y,
            vx: this.isPlayer ? 10 : -10,
            vy: (Math.random() - 0.5) * 0.8,
            isPlayer: this.isPlayer
        });
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        if (!this.isPlayer) {
            ctx.scale(-1, 1);
        }

        // 1. المجنزرات الخارجية
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-28, -22, 56, 10);
        ctx.fillRect(-28, 12, 56, 10);

        // 2. جسم الدبابة الرئيسي
        ctx.fillStyle = this.isPlayer ? '#0284c7' : '#dc2626';
        ctx.fillRect(-24, -15, 48, 30);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(-24, -15, 48, 30);

        // 3. دروع وجوانب الدبابة
        ctx.fillStyle = this.isPlayer ? '#0369a1' : '#991b1b';
        ctx.fillRect(-20, -13, 12, 26);
        ctx.fillRect(8, -13, 12, 26);

        // 4. برج الرشاش الجاتلينج
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();

        // 5. سبطانة الرشاش
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(8, -4, 24, 8);
        ctx.fillStyle = '#475569';
        ctx.fillRect(14, -5, 4, 10);
        ctx.fillRect(22, -5, 4, 10);

        // 6. وميض النار عند الإطلاق
        if (Date.now() - this.lastShoot < 60) {
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(34, 0, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();

        // شريط الصحة
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(this.x - 25, this.y - 32, 50, 6);
        ctx.fillStyle = this.isPlayer ? '#4ade80' : '#ef4444';
        ctx.fillRect(this.x - 25, this.y - 32, (this.hp / this.maxHp) * 50, 6);
    }
}

function spawnTank() {
    if (gold >= 50) {
        gold -= 50;
        document.getElementById('gold-val').innerText = gold;
        playerTanks.push(new Tank(60, canvas.height / 2 + (Math.random() * 100 - 50), true));
    }
}

// توليد أعداء تلقائياً
setInterval(() => {
    enemyTanks.push(new Tank(canvas.width - 60, canvas.height / 2 + (Math.random() * 100 - 50), false));
}, 4000);

// زيادة الذهب تلقائياً
setInterval(() => {
    gold += 10;
    document.getElementById('gold-val').innerText = gold;
}, 1000);

function gameLoop() {
    // أرضية الميدان
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // خطوط الشبكة
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;
    for(let i=0; i<canvas.height; i+=40) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
    }

    // تحديث ورسم الطلقات
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = b.isPlayer ? '#fef08a' : '#f87171';
        ctx.fill();

        // تصادم الطلقات مع أعداء
        if (b.isPlayer) {
            enemyTanks.forEach((enemy, eIdx) => {
                if (Math.hypot(b.x - enemy.x, b.y - enemy.y) < 25) {
                    enemy.hp -= 10;
                    bullets.splice(i, 1);
                    if (enemy.hp <= 0) enemyTanks.splice(eIdx, 1);
                }
            });
        } else {
            playerTanks.forEach((player, pIdx) => {
                if (Math.hypot(b.x - player.x, b.y - player.y) < 25) {
                    player.hp -= 10;
                    bullets.splice(i, 1);
                    if (player.hp <= 0) playerTanks.splice(pIdx, 1);
                }
            });
        }

        if (b.x < 0 || b.x > canvas.width) {
            bullets.splice(i, 1);
        }
    }

    // رسم الدبابات
    playerTanks.forEach(tank => {
        tank.update();
        tank.draw();
    });

    enemyTanks.forEach(tank => {
        tank.update();
        tank.draw();
    });

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
