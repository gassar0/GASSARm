<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>حرب المدفعية - المدفع المتطور</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #0f2027; overflow: hidden; touch-action: none;
        }
        #gameCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            display: block;
        }
        #ui {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; font-size: 16px;
            font-weight: bold; color: #fff; z-index: 10; pointer-events: none;
        }
        .stat-box { background: rgba(0, 0, 0, 0.7); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); }
        #gameOverScreen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); flex-direction: column; justify-content: center;
            align-items: center; z-index: 20; color: #fff;
        }
        #restartBtn {
            background: #2ecc71; border: none; color: white; padding: 12px 25px;
            font-size: 18px; border-radius: 20px; margin-top: 15px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat-box">النقاط: <span id="score">0</span></div>
        <div class="stat-box">الموجة: <span id="wave">1</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="gameOverScreen">
        <h1 style="color: #e74c3c;">تم تدمير الدفاعات!</h1>
        <p id="finalScore">مجموع النقاط: 0</p>
        <button id="restartBtn" onclick="restartGame()">إعادة اللعب</button>
    </div>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let score = 0, wave = 1, gameOver = false;

            const cannon = {
                x: canvas.width / 2 - 25,
                y: canvas.height - 100,
                width: 50, height: 40,
                fireRate: 200, lastShot: 0
            };

            let bullets = [], enemies = [], lastEnemySpawn = 0;
            let touchX = cannon.x;

            // تحريك المدفع مباشرة بمكان إصبع الشاشة
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                touchX = e.touches[0].clientX;
            }, { passive: false });

            canvas.addEventListener('mousemove', (e) => {
                touchX = e.clientX;
            });

            function shoot() {
                const now = Date.now();
                if (now - cannon.lastShot > cannon.fireRate) {
                    bullets.push({ 
                        x: cannon.x + cannon.width / 2 - 4, 
                        y: cannon.y, 
                        speed: 12, 
                        width: 8, 
                        height: 16 
                    });
                    cannon.lastShot = now;
                }
            }

            function spawnEnemy() {
                const now = Date.now();
                if (now - lastEnemySpawn > 1000) {
                    const size = 45;
                    enemies.push({
                        x: Math.random() * (canvas.width - size),
                        y: -size,
                        width: size, height: size,
                        speed: 2 + (wave * 0.2)
                    });
                    lastEnemySpawn = now;
                }
            }

            function update() {
                if (gameOver) return;

                // تتبع حركة الاصبع بنعومة
                cannon.x += (touchX - (cannon.x + cannon.width / 2)) * 0.2;
                if (cannon.x < 0) cannon.x = 0;
                if (cannon.x > canvas.width - cannon.width) cannon.x = canvas.width - cannon.width;

                // إطلاق نار تلقائي مستمر
                shoot();

                wave = Math.floor(score / 30) + 1;
                document.getElementById('wave').innerText = wave;

                for (let i = bullets.length - 1; i >= 0; i--) {
                    bullets[i].y -= bullets[i].speed;
                    if (bullets[i].y < 0) bullets.splice(i, 1);
                }

                spawnEnemy();
                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    e.y += e.speed;

                    if (e.y + e.height >= cannon.y) {
                        gameOver = true;
                        document.getElementById('finalScore').innerText = "مجموع النقاط: " + score;
                        document.getElementById('gameOverScreen').style.display = 'flex';
                        return;
                    }

                    for (let j = bullets.length - 1; j >= 0; j--) {
                        let b = bullets[j];
                        if (b.x < e.x + e.width && b.x + b.width > e.x &&
                            b.y < e.y + e.height && b.y + b.height > e.y) {
                            bullets.splice(j, 1);
                            enemies.splice(i, 1);
                            score += 10;
                            document.getElementById('score').innerText = score;
                            break;
                        }
                    }
                }
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // رسم المدفع
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(cannon.x, cannon.y + 15, cannon.width, cannon.height - 15);
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(cannon.x + cannon.width / 2 - 6, cannon.y, 12, 20);

                // رسم الطلقات
                ctx.fillStyle = '#e74c3c';
                bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

                // رسم الأعداء
                ctx.fillStyle = '#e67e22';
                enemies.forEach(e => {
                    ctx.fillRect(e.x, e.y, e.width, e.height);
                });
            }

            function loop() {
                update();
                draw();
                if (!gameOver) requestAnimationFrame(loop);
            }

            window.restartGame = function() {
                score = 0; wave = 1; gameOver = false;
                bullets = []; enemies = [];
                cannon.x = canvas.width / 2 - 25;
                document.getElementById('score').innerText = 0;
                document.getElementById('wave').innerText = 1;
                document.getElementById('gameOverScreen').style.display = 'none';
                loop();
            }

            loop();
        };
    </script>
</body>
</html>
