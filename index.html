<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>معركة الدبابات التكتيكية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #12181b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #ui-header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            z-index: 10;
        }
        .stat-box {
            font-weight: bold;
            font-size: 16px;
        }
        #canvas {
            width: 100%;
            height: 100%;
            background: #2a3439;
        }
        #controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            active: transform scale(0.95);
        }
        .btn-danger { background: #dc2626; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-header">
        <div class="stat-box" style="color: #4ade80;">الذهب: <span id="gold-val">100</span></div>
        <div class="stat-box" style="color: #ef4444;">صحة القاعدة: <span id="hp-val">1000</span></div>
    </div>
    
    <canvas id="canvas"></canvas>

    <div id="controls">
        <button class="btn" onclick="spawnTank()">إرسال دبابة جاتلينج (50 ذهب)</button>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gold = 100;
let baseHP = 1000;

// تحميل صورة الدبابة المخصصة (الصورة الشفافة التي أرسلتها)
const tankImg = new Image();
tankImg.src = 'https://i.ibb.co/L8v11fK/tank-sprite.png'; // رابط الصورة الشفافة للدبابة

// القوات والمقذوفات
let playerTanks = [];
let enemyTanks = [];
let bullets = [];
let particles = [];

class Tank {
    constructor(x, y, isPlayer = true) {
        this.x = x;
        this.y = y;
        this.size = 60;
        this.speed = isPlayer ? 1.5 : -1.2;
        this.isPlayer = isPlayer;
        this.hp = 100;
        this.maxHp = 100;
        this.lastShoot = 0;
        this.fireRate = 200; // سرعة ضرب الرشاش بالملي ثانية
    }

    update() {
        this.x += this.speed;

        // إطلاق النار تلقائياً عند الاشتباك
        let now = Date.now();
        if (now - this.lastShoot > this.fireRate) {
            this.shoot();
            this.lastShoot = now;
        }
    }

    shoot() {
        // إنشاء طلقة مرئية تخرج من الفوهة
        bullets.push({
            x: this.isPlayer ? this.x + 30 : this.x - 30,
            y: this.y - 15, // من اتجاه الفوهة
            vx: this.isPlayer ? 8 : -8,
            vy: (Math.random() - 0.5) * 0.5,
            isPlayer: this.isPlayer,
            color: this.isPlayer ? '#fef08a' : '#f87171'
        });
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        if (!this.isPlayer) {
            ctx.scale(-1, 1); // تدوير دبابة العدو للاتجاه المعاكس
