<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>حرب المدفعية - المدفع المتطور</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #0f2027; overflow: hidden; touch-action: none;
        }
        #gameCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            display: block;
        }
        #ui {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; font-size: 16px;
            font-weight: bold; color: #fff; z-index: 10; pointer-events: none;
        }
        .stat-box { background: rgba(0, 0, 0, 0.7); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); }
        #controls {
            position: absolute; bottom: 25px; left: 0; width: 100%;
            display: flex; justify-content: space-around; padding: 0 15px; z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.25); border: 2px solid rgba(255, 255, 255, 0.6);
            color: white; padding: 20px 35px; font-size: 22px; border-radius: 40px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        #fireBtn { background: rgba(231, 76, 60, 0.9); border-color: #e74c3c; }
        #gameOverScreen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); flex-direction: column; justify-content: center;
            align-items: center; z-index: 20; color: #fff;
        }
        #restartBtn {
            background: #2ecc71; border: none; color: white; padding: 12px 25px;
            font-size: 18px; border-radius: 20px; margin-top: 15px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat-box">النقاط: <span id="score">0</span></div>
        <div class="stat-box">الموجة: <span id="wave">1</span></div>
        <div class="stat-box">المستوى: <span id="level">1</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <button class="btn" id="leftBtn">◀</button>
        <button class="btn" id="fireBtn">🔥 إطلاق</button>
        <button class="btn" id="rightBtn">▶</button>
    </div>

    <div id="gameOverScreen">
        <h1 style="color: #e74c3c;">تم تدمير الدفاعات!</h1>
        <p id="finalScore">مجموع النقاط: 0</p>
        <button id="restartBtn" onclick="restartGame()">إعادة اللعب</button>
    </div>

    <script>

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let score = 0, wave = 1, gameOver = false;

            const cannon = {
                x: canvas.width / 2 - 25,
                y: canvas.height - 150,
                width: 50, height: 40,
                speed: 9, level: 1, fireRate: 220, lastShot: 0
            };

            let bullets = [], enemies = [], lastEnemySpawn = 0;
            let moveLeft = false, moveRight = false, isFiring = false;

            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            const fireBtn = document.getElementById('fireBtn');

            // استخدام نظام pointer events الأحدث لاستجابة فورية للموبايل
            leftBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); moveLeft = true; });
            leftBtn.addEventListener('pointerup', () => moveLeft = false);
            leftBtn.addEventListener('pointerleave', () => moveLeft = false);

            rightBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); moveRight = true; });
            rightBtn.addEventListener('pointerup', () => moveRight = false);
            rightBtn.addEventListener('pointerleave', () => moveRight = false);

            fireBtn.addEventListener('pointerup', () => isFiring = false);
            fireBtn.addEventListener('pointerleave', () => isFiring = false);

                }
